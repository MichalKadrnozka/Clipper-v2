name: Tests and desktop builds
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e .
      - name: Check wheel contains interface assets
        run: |
          python -m pip wheel --no-deps -w wheelhouse .
          python -c "import glob, zipfile; z=zipfile.ZipFile(glob.glob('wheelhouse/*.whl')[0]); names=z.namelist(); assert 'clipper/assets/icons/icons8-play-96.png' in names and 'clipper/assets/icons/ICON_SOURCE.txt' in names"
      - name: Verify Qt Multimedia on Windows
        if: runner.os == 'Windows'
        run: python -c "from PyQt6 import QtMultimedia, QtMultimediaWidgets"
      - run: python -m unittest discover -s tests -v
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $report = Join-Path $env:RUNNER_TEMP 'clipper-self-test.json'
          $process = Start-Process -FilePath './dist/Clipper/Clipper.exe' -ArgumentList @('--self-test', ('"' + $report + '"')) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged app self-test failed' }
          $uiReport = Join-Path $env:RUNNER_TEMP 'clipper-ui-self-test.json'
          $uiProcess = Start-Process -FilePath './dist/Clipper/Clipper.exe' -ArgumentList @('--self-test-ui', ('"' + $uiReport + '"')) -Wait -PassThru
          if (Test-Path $uiReport) { Get-Content $uiReport }
          if ($uiProcess.ExitCode -ne 0 -or -not (Test-Path $uiReport)) { throw 'Packaged app UI self-test failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Clipper-Windows
          path: dist/Clipper

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: ./scripts/build-linux.sh
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/Linux/Clipper/Clipper --self-test "$RUNNER_TEMP/clipper-self-test.json"
          cat "$RUNNER_TEMP/clipper-self-test.json"
          QT_QPA_PLATFORM=offscreen ./dist/Linux/Clipper/Clipper --self-test-ui "$RUNNER_TEMP/clipper-ui-self-test.json"
          cat "$RUNNER_TEMP/clipper-ui-self-test.json"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Clipper-Linux
          path: dist/Linux/Clipper
